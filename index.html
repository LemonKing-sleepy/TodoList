<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>
      <form>
        <input
          id="todo-input"
          type="text"
          placeholder="Input what to do and click Add button"
          autocomplete="off"
        />
        <input type="submit" id="input-add-btn" value="Add" />
      </form>
      <ul id="todo-items"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
